<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="50%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-wall)" />
  <!-- Telemetry Graph lines -->
  <g opacity="0.4" stroke="#1e293b" stroke-width="2">
    <path d="M100 150 H1100 M100 250 H1100 M100 350 H1100 M100 450 H1100" />
    <path d="M250 100 V500 M450 100 V500 M650 100 V500 M850 100 V500 M1050 100 V500" />
  </g>
  <!-- Futuristic CPU/RAM curves -->
  <path d="M100 420 Q 250 380, 350 280 T 550 320 T 750 180 T 950 220 T 1100 140" fill="none" stroke="url(#cyan-glow)" stroke-width="6" />
  <path d="M100 460 Q 250 440, 400 390 T 650 420 T 850 320 T 1100 280" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.8" />
  
  <text x="600" y="520" fill="#ffffff" font-family="system-ui, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="2">LINACRE SYSTEM WALLPAPER</text>
  <text x="600" y="570" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="1">REAL-TIME CPU &bull; GPU &bull; RAM &bull; HARDWARE HUD</text>
</svg>
