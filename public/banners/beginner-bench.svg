<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Beginner 2x4 Bench Plan Banner</title>
<desc id="desc">A straight wooden bench with labelled 2x4 parts, build guide title, and 3D model mention.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff8ea"/><stop offset="1" stop-color="#ead8bd"/></linearGradient>
  <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#c98d4d"/><stop offset="1" stop-color="#855025"/></linearGradient>
  <pattern id="grain" width="90" height="16" patternUnits="userSpaceOnUse"><path d="M0 9 C24 2 46 17 90 8" fill="none" stroke="#6c3c1b" stroke-width="2" opacity=".38"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".20"/></filter>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<circle cx="1090" cy="120" r="170" fill="#2d6a4f" opacity=".10"/>
<circle cx="160" cy="545" r="210" fill="#87562a" opacity=".10"/>
<g transform="translate(120,150)" filter="url(#shadow)">
  <ellipse cx="500" cy="350" rx="430" ry="42" fill="#000" opacity=".10"/>
  <rect x="0" y="40" width="860" height="76" rx="12" fill="url(#wood)" stroke="#4b2b15" stroke-width="8"/>
  <rect x="0" y="40" width="860" height="76" rx="12" fill="url(#grain)"/>
  <line x1="34" y1="65" x2="826" y2="65" stroke="#6f3f1e" stroke-width="4" opacity=".45"/>
  <line x1="34" y1="92" x2="826" y2="92" stroke="#6f3f1e" stroke-width="4" opacity=".35"/>
  <rect x="110" y="116" width="92" height="260" rx="4" fill="#9b5d2b" stroke="#4b2b15" stroke-width="8"/>
  <rect x="650" y="116" width="92" height="260" rx="4" fill="#9b5d2b" stroke="#4b2b15" stroke-width="8"/>
  <rect x="84" y="120" width="144" height="58" rx="8" fill="#d69b5d" stroke="#4b2b15" stroke-width="7"/>
  <rect x="624" y="120" width="144" height="58" rx="8" fill="#d69b5d" stroke="#4b2b15" stroke-width="7"/>
  <rect x="130" y="260" width="592" height="70" rx="8" fill="#7f4f24" stroke="#4b2b15" stroke-width="8"/>
  <g fill="#2b2119"><circle cx="60" cy="78" r="8"/><circle cx="800" cy="78" r="8"/><circle cx="160" cy="148" r="7"/><circle cx="694" cy="148" r="7"/><circle cx="168" cy="296" r="7"/><circle cx="684" cy="296" r="7"/></g>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#37210f">
    <text x="38" y="28">A seat slats</text>
    <text x="112" y="405">B legs</text>
    <text x="336" y="250">D stretchers</text>
  </g>
</g>
<g font-family="Arial, sans-serif" fill="#37210f">
  <text x="120" y="82" font-size="56" font-weight="800">Beginner 2×4 Bench</text>
  <text x="120" y="122" font-size="28" fill="#5d6470">Complete responsive build guide with cut lists, diagrams, and a rotatable 3D model</text>
  <g transform="translate(965,445)">
    <rect x="0" y="0" width="215" height="58" rx="29" fill="#2d6a4f"/>
    <text x="108" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="white">Straight cuts only</text>
  </g>
</g>
</svg>
