<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Project artwork — whole-home-adblocker">
  <defs>
    <radialGradient id="glowS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58d5c9" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#58d5c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0ab3c" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#f0ab3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58d5c9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58d5c9" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#f0ab3c" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0a0e15"/>

  <!-- faint blueprint grid -->
  <g stroke="#22384a" stroke-opacity=".28" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- ambient glows -->
  <circle cx="380" cy="315" r="260" fill="url(#glowS)"/>
  <circle cx="890" cy="315" r="240" fill="url(#glowA)"/>

  <!-- connection hairlines: devices -> shield -->
  <rect x="430" y="308" width="620" height="2" fill="url(#hairline)" opacity=".55"/>
  <path d="M470 250 C 640 250, 640 250, 795 250" stroke="#58d5c9" stroke-opacity=".4" stroke-width="2" fill="none"/>
  <path d="M470 380 C 620 380, 640 385, 760 385" stroke="#58d5c9" stroke-opacity=".4" stroke-width="2" fill="none"/>

  <!-- incoming ads, blocked at the shield edge -->
  <g stroke="#f0ab3c" stroke-width="3" fill="none">
    <rect x="52" y="175" width="130" height="84" rx="6" stroke-opacity=".9"/>
    <rect x="78" y="355" width="130" height="84" rx="6" stroke-opacity=".55"/>
  </g>
  <polygon points="98,205 98,229 122,217" fill="none" stroke="#f0ab3c" stroke-width="3" stroke-opacity=".9"/>
  <text x="118" y="424" font-family="monospace" font-size="26" fill="#f0ab3c" fill-opacity=".55" text-anchor="middle">AD</text>
  <!-- shatter particles on impact -->
  <g fill="#f0ab3c">
    <polygon points="238,215 252,208 248,224"/>
    <polygon points="258,240 272,244 260,252"/>
    <polygon points="232,262 244,270 232,276"/>
    <circle cx="268" cy="222" r="4"/>
    <circle cx="246" cy="292" r="3" opacity=".7"/>
    <circle cx="258" cy="172" r="3" opacity=".5"/>
  </g>

  <!-- the shield -->
  <circle cx="380" cy="315" r="150" fill="url(#glowS)" filter="url(#soft)"/>
  <path d="M380 155 L502 224 L502 402 L380 475 L258 402 L258 224 Z"
        fill="#0a0e15" fill-opacity=".55" stroke="#58d5c9" stroke-width="4"/>
  <path d="M380 178 L482 235 L482 392 L380 450 L278 392 L278 235 Z"
        fill="none" stroke="#58d5c9" stroke-opacity=".45" stroke-width="2"/>
  <path d="M322 318 l40 40 l78 -82" fill="none" stroke="#f0ab3c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- protected home network -->
  <g stroke="#58d5c9" stroke-width="3" fill="none">
    <!-- TV -->
    <rect x="800" y="190" width="190" height="118" rx="8"/>
    <line x1="860" y1="308" x2="860" y2="330"/>
    <line x1="822" y1="338" x2="898" y2="338"/>
    <!-- laptop -->
    <rect x="762" y="372" width="200" height="126" rx="8"/>
    <path d="M744 498 L980 498 L1000 522 L724 522 Z" stroke-opacity=".85"/>
    <!-- phone -->
    <rect x="1030" y="232" width="92" height="168" rx="14"/>
    <line x1="1064" y1="252" x2="1088" y2="252"/>
    <line x1="1066" y1="378" x2="1086" y2="378"/>
  </g>
  <!-- wifi arcs from shield -->
  <g stroke="#58d5c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity=".6">
    <path d="M520 260 a170 170 0 0 1 60 40"/>
    <path d="M536 300 a120 120 0 0 1 40 26"/>
  </g>
</svg>
