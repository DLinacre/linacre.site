<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ff3b30" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1e293b" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="580" cy="320" r="340" fill="url(#centerGlow)" />
  <circle cx="200" cy="120" r="180" fill="#3b82f6" fill-opacity="0.04" />
  <circle cx="1100" cy="520" r="220" fill="#10b981" fill-opacity="0.03" />

  <!-- Top Badge / Kicker -->
  <g transform="translate(640, 95)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#1e2430" stroke="#334155" stroke-width="1.5"/>
    <circle cx="-135" cy="0" r="4" fill="#ff3b30"/>
    <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ff3b30" letter-spacing="2">OPTIMAL RECOGNITION POINT</text>
    <text x="75" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">· 600 WPM</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(640, 175)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Kinetic RSVP Speed Reader
    </text>
    <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      Frictionless Rapid Serial Visual Presentation for PDF, ePub, TXT, and Web Books
    </text>
  </g>

  <!-- Central Reticle Frame Showcase -->
  <g transform="translate(240, 260)">
    <!-- Main Box Container -->
    <rect x="0" y="0" width="800" height="180" rx="20" fill="#0c0f17" stroke="#1f293d" stroke-width="2"/>
    
    <!-- Top and Bottom Reticle Guide Lines -->
    <line x1="40" y1="35" x2="760" y2="35" stroke="#2a3547" stroke-width="2.5" stroke-dasharray="1 0"/>
    <line x1="40" y1="145" x2="760" y2="145" stroke="#2a3547" stroke-width="2.5" stroke-dasharray="1 0"/>
    
    <!-- Top & Bottom Vertical Notch Ticks (Aligned on ORP Focal Point x=320) -->
    <line x1="320" y1="35" x2="320" y2="52" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="145" x2="320" y2="128" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Word Rendering: "f o c u s" with 'c' pinned at 320 -->
    <!-- Left segment "fo" right-aligned at 320 -->
    <text x="305" y="102" font-family="'Merriweather', Georgia, serif" font-size="52" font-weight="400" fill="#f8fafc" text-anchor="end">
      fo
    </text>
    <!-- Focal letter 'c' pinned at 320 in vivid red -->
    <text x="320" y="102" font-family="'Merriweather', Georgia, serif" font-size="52" font-weight="700" fill="#ff3b30" text-anchor="middle">
      c
    </text>
    <!-- Right segment "us" left-aligned at 320 -->
    <text x="335" y="102" font-family="'Merriweather', Georgia, serif" font-size="52" font-weight="400" fill="#f8fafc" text-anchor="start">
      us
    </text>

    <!-- Velocity Indicator (like in video) -->
    <text x="750" y="165" font-family="'JetBrains Mono', monospace" font-size="13" font-style="italic" fill="#64748b" text-anchor="end">
      600 wpm
    </text>

    <!-- Peripheral ghost context words -->
    <text x="50" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">
      ← kinetic
    </text>
    <text x="400" y="165" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">
      perception →
    </text>
  </g>

  <!-- Feature Pills Footer -->
  <g transform="translate(640, 520)" text-anchor="middle">
    <!-- Format Badges -->
    <g transform="translate(-360, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="10" fill="#131824" stroke="#253047" stroke-width="1.2"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">📄 PDF Support</text>
    </g>
    <g transform="translate(-180, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="10" fill="#131824" stroke="#253047" stroke-width="1.2"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">📚 ePub Reader</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-70" y="-16" width="140" height="32" rx="10" fill="#131824" stroke="#253047" stroke-width="1.2"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">⚡ 600-1200 WPM</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="10" fill="#131824" stroke="#253047" stroke-width="1.2"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">🎨 8 Themes</text>
    </g>
    <g transform="translate(360, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="10" fill="#131824" stroke="#253047" stroke-width="1.2"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f43f5e">🔒 100% Client-Side</text>
    </g>
  </g>

  <!-- Bottom subtle line -->
  <line x1="200" y1="590" x2="1080" y2="590" stroke="#1e293b" stroke-width="1"/>
  <text x="640" y="615" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="1">
    OPEN SOURCE · REACT 19 · TYPESCRIPT · VITE · TAILWIND CSS
  </text>
</svg>
