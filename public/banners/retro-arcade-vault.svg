<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Retro Arcade Vault banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#090a12"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="25%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="arcadeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#arcadeGrid)"/>
  <rect width="1200" height="420" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" fill="url(#glowPink)"/>
  <rect width="1200" height="420" fill="url(#glowPurple)"/>

  <rect x="15" y="15" width="1170" height="390" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  <path d="M 15 50 L 15 15 L 50 15" fill="none" stroke="#00ffcc" stroke-width="4"/>
  <path d="M 1185 50 L 1185 15 L 1150 15" fill="none" stroke="#ff2a85" stroke-width="4"/>
  <path d="M 15 370 L 15 405 L 50 405" fill="none" stroke="#00ffcc" stroke-width="4"/>
  <path d="M 1185 370 L 1185 405 L 1150 405" fill="none" stroke="#ff2a85" stroke-width="4"/>

  <line x1="60" y1="65" x2="1140" y2="65" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="60" y1="355" x2="1140" y2="355" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <g transform="translate(600, 72)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="28" rx="14" fill="rgba(0, 255, 204, 0.12)" stroke="#00ffcc" stroke-width="1"/>
    <text x="0" y="2" fill="#00ffcc" font-family="'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="3.5">★ OPERATOR'S CUT v4.1 ★</text>
  </g>

  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="58" letter-spacing="4" fill="url(#titleGrad)" filter="url(#neonGlow)">RETRO ARCADE VAULT</text>

  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="2.5" fill="#cbd5e1">125 CURATED CLASSICS  ·  CRT CABINET  ·  TROPHIES  ·  INSTANT IN-BROWSER PLAY</text>

  <g transform="translate(600, 280)">
    <g transform="translate(-470, 0)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#181f33" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="85" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#93c5fd">PS1 · 37 games</text>
    </g>
    <g transform="translate(-280, 0)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#181f33" stroke="#a855f7" stroke-width="1.5"/>
      <text x="85" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#d8b4fe">GBA · 28 games</text>
    </g>
    <g transform="translate(-90, 0)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#181f33" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="85" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#67e8f9">NDS · 21 games</text>
    </g>
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#181f33" stroke="#eab308" stroke-width="1.5"/>
      <text x="85" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#fde047">SNES · 18 games</text>
    </g>
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#181f33" stroke="#ec4899" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#f472b6">SEGA · 21 games</text>
    </g>
  </g>

  <g transform="translate(600, 375)" text-anchor="middle">
    <text x="0" y="0" fill="#64748b" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">VANILLA HTML5 / CSS3 / JS  ·  LOCALSTORAGE  ·  PWA  ·  STANDALONE &amp; PORTABLE</text>
  </g>
</svg>
