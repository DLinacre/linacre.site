<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914"/>
      <stop offset="50%" stop-color="#0e1326"/>
      <stop offset="100%" stop-color="#06070d"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="20%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMagenta" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff0077" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff0077" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff0077"/>
    </linearGradient>
    <linearGradient id="tabGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glowCyan)"/>
  <rect width="1200" height="400" fill="url(#glowMagenta)"/>
  <rect width="1200" height="400" fill="url(#glowPurple)"/>

  <!-- Cyber Horizon Line -->
  <line x1="0" y1="398" x2="1200" y2="398" stroke="url(#neonTitle)" stroke-width="2" opacity="0.6"/>

  <!-- Floating Browser Tab Shapes -->
  <!-- Tab 1: Left Cyan -->
  <g transform="translate(100, 45) rotate(-4)" opacity="0.85">
    <path d="M 0 35 Q 0 10 10 10 L 150 10 Q 160 10 160 35 L 160 90 L 0 90 Z" fill="url(#tabGrad1)" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="20" cy="25" r="4" fill="#ff5f56"/>
    <circle cx="34" cy="25" r="4" fill="#ffbd2e"/>
    <circle cx="48" cy="25" r="4" fill="#27c93f"/>
    <text x="65" y="29" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">zombies.wasm</text>
    <rect x="15" y="42" width="130" height="38" rx="6" fill="#0b1120" stroke="rgba(0,240,255,0.2)"/>
    <circle cx="35" cy="61" r="10" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="35" y1="47" x2="35" y2="75" stroke="#00f0ff" stroke-width="1"/>
    <line x1="21" y1="61" x2="49" y2="61" stroke="#00f0ff" stroke-width="1"/>
    <text x="55" y="65" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">TARGET LOCK</text>
  </g>

  <!-- Tab 2: Right Magenta -->
  <g transform="translate(940, 50) rotate(5)" opacity="0.85">
    <path d="M 0 35 Q 0 10 10 10 L 160 10 Q 170 10 170 35 L 170 90 L 0 90 Z" fill="url(#tabGrad1)" stroke="#ff0077" stroke-width="1.5"/>
    <circle cx="20" cy="25" r="4" fill="#ff5f56"/>
    <circle cx="34" cy="25" r="4" fill="#ffbd2e"/>
    <circle cx="48" cy="25" r="4" fill="#27c93f"/>
    <text x="65" y="29" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">quake3.arena</text>
    <rect x="15" y="42" width="140" height="38" rx="6" fill="#0b1120" stroke="rgba(255,0,119,0.25)"/>
    <text x="30" y="66" fill="#ff2a85" font-family="monospace" font-size="12" font-weight="bold">FRAG: 128 FPS</text>
  </g>

  <!-- Central Header Content -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Top Badge -->
    <rect x="-160" y="65" width="320" height="30" rx="15" fill="rgba(15,23,42,0.85)" stroke="url(#neonTitle)" stroke-width="1.2"/>
    <circle cx="-135" cy="80" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>
    <text x="8" y="86" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">
      CURATED BROWSER GAMING VAULT
    </text>

    <!-- Main Title -->
    <text x="0" y="180" fill="url(#neonTitle)" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="74" font-weight="900" letter-spacing="4" filter="url(#neonGlow)">
      TABULOUS GAMES
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="232" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="1">
      Classic Masterpieces &amp; 3D Ports Running Directly In Your Browser Tab
    </text>

    <text x="0" y="265" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Zero Launchers · Zero Installs · Pure WebAssembly &amp; WebGL Acceleration
    </text>

    <!-- Pill Stats Row -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-85" y="0" width="170" height="42" rx="21" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-width="1.2"/>
        <text x="0" y="26" fill="#00f0ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
          🎮 22 VERIFIED GAMES
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="0" width="190" height="42" rx="21" fill="rgba(168, 85, 247, 0.08)" stroke="#a855f7" stroke-width="1.2"/>
        <text x="0" y="26" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
          ⚡ INSTANT PLAY (WASM)
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(250, 0)">
        <rect x="-85" y="0" width="170" height="42" rx="21" fill="rgba(255, 0, 119, 0.08)" stroke="#ff0077" stroke-width="1.2"/>
        <text x="0" y="26" fill="#ff2a85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
          🌐 MULTIPLAYER READY
        </text>
      </g>
    </g>
  </g>
</svg>