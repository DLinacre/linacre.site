# ==============================================================================
# linacre.site - High Performance Windows Runner CI/CD Matrix
# Runs on local 24/7 Windows Runner (ID: 56201256)
# ==============================================================================

stages:
  - verify
  - security
  - build
  - deploy

default:
  tags:
    - windows
    - powershell

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

typecheck_and_test:
  stage: verify
  script:
    - npm ci
    - npm run typecheck
    - npm test

security_audit:
  stage: security
  script:
    - $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
    - Write-Host "==> Running Gitleaks Secret Detection..."
    - gitleaks detect --source "." --no-git --redact -v
    - Write-Host "==> Running Trivy Dependency & Vulnerability Scan..."
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 .
  allow_failure: true

build_site:
  stage: build
  dependencies:
    - typecheck_and_test
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 3 days

pages:
  stage: deploy
  dependencies:
    - build_site
  script:
    - if (Test-Path public) { Remove-Item -Path public -Recurse -Force }
    - New-Item -ItemType Directory -Path public -Force | Out-Null
    - Copy-Item -Path "dist\*" -Destination "public\" -Recurse -Force
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
