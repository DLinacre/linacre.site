<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--ROUTE_HEAD-->
    <title>Linacre.site — every project, tool and game by David Linacre</title>
    <meta name="description" content="The complete index of David Linacre's work: live apps, AI products, developer tools and games, all searchable from one page." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.linacre.site/" />
    <!--/ROUTE_HEAD-->
    <meta name="author" content="David Christopher Linacre" />
    <meta name="theme-color" content="#030c14" />
    <meta name="color-scheme" content="dark light" />

    <!-- Preconnect / DNS-prefetch (Performance) -->
    <!-- Default fonts are self-hosted, but custom themes load Google Fonts via
         @import (src/config/brand.ts), and the AI Lab pulls sprites from
         Pokémon Showdown — warm those connections up early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://play.pokemonshowdown.com" />

    <!-- Critical self-hosted fonts -->
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-var-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Web App & PWA Support -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Hreflang -->
    <link rel="alternate" hreflang="en-GB" href="https://www.linacre.site/" />
    <link rel="alternate" hreflang="x-default" href="https://www.linacre.site/" />

  </head>
  <body>
    <div id="root" style="min-height:100svh"><!--ROUTE_CONTENT--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
